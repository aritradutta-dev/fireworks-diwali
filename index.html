<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎆 Fireworks Conductor — Diwali 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Hidden Video Element for MediaPipe Input -->
      <video id="webcam" playsinline muted autoplay></video>

      <!-- Main Compositing & Pyrotechnic Canvas -->
      <canvas id="stage"></canvas>

      <!-- Night Sky Atmospheric Vignette -->
      <div class="vignette-overlay"></div>

      <!-- Grand Finale Centerpiece: Shows "HAPPY DIWALI" in center after Grand Finale -->
      <div id="grand-finale-center" class="grand-finale-center hidden">
        <div class="finale-sparkle-aura"></div>
        <h1 class="finale-heading">✨ HAPPY DIWALI ✨</h1>
        <p class="finale-subheading">May your year blaze with light, joy & prosperity</p>
      </div>

      <!-- UI Container (toggled in Creator Mode via 'H') -->
      <div id="hud" class="hud-container">
        <!-- Minimal, Colorful Top Navigation Bar -->
        <header class="hud-header">
          <!-- Minimal Festive Pill (replaces bulky logo) -->
          <div class="festive-badge">
            <span class="badge-dot"></span>
            <span class="badge-text">Diwali 2026</span>
          </div>

          <!-- Quick Controls Dock -->
          <div class="header-actions">
            <button id="btn-audio" class="action-btn" title="Toggle Sound (M)">
              <span class="btn-icon">🔊</span>
              <span class="btn-label">Sound</span>
            </button>
            <button id="btn-debug" class="action-btn" title="Toggle Hand Skeleton (D)">
              <span class="btn-icon">👁️</span>
              <span class="btn-label">Tracker</span>
            </button>
            <button id="btn-screenshot" class="action-btn btn-snap" title="Save Postcard Photo (S)">
              <span class="btn-icon">📸</span>
              <span class="btn-label">Snap</span>
            </button>
            <button id="btn-record" class="action-btn btn-record" title="Record Video Reel (R)">
              <span class="record-dot"></span>
              <span id="record-label" class="btn-label">Record</span>
              <span id="record-timer" class="record-timer">00:00</span>
            </button>
            <button id="btn-creator-mode" class="action-btn" title="Creator Mode — Hide HUD for Reels (H)">
              <span class="btn-icon">🎬</span>
              <span class="btn-label">Clean (H)</span>
            </button>
          </div>
        </header>

        <!-- Colorful, Vibrant Gesture Guide Dock -->
        <footer class="hud-footer">
          <div class="gesture-bar">
            <div class="gesture-card card-rocket" data-gesture="ROCKET">
              <span class="gesture-badge">☝️</span>
              <div class="gesture-info">
                <span class="gesture-name">Rocket</span>
                <span class="gesture-sub">Point Up</span>
              </div>
            </div>

            <div class="gesture-card card-anar" data-gesture="ANAR">
              <span class="gesture-badge">✊</span>
              <div class="gesture-info">
                <span class="gesture-name">Anar</span>
                <span class="gesture-sub">Fist</span>
              </div>
            </div>

            <div class="gesture-card card-starburst" data-gesture="STARBURST">
              <span class="gesture-badge">✋</span>
              <div class="gesture-info">
                <span class="gesture-name">Starburst</span>
                <span class="gesture-sub">Palm</span>
              </div>
            </div>

            <div class="gesture-card card-roman" data-gesture="ROMAN_CANDLE">
              <span class="gesture-badge">✌️</span>
              <div class="gesture-info">
                <span class="gesture-name">Roman Candle</span>
                <span class="gesture-sub">Peace</span>
              </div>
            </div>

            <div class="gesture-card card-phooljhadi" data-gesture="PHOOLJHADI">
              <span class="gesture-badge">👌</span>
              <div class="gesture-info">
                <span class="gesture-name">Phooljhadi</span>
                <span class="gesture-sub">Pinch</span>
              </div>
            </div>

            <div class="gesture-card card-finale" data-gesture="GRAND_FINALE">
              <span class="gesture-badge">🙌</span>
              <div class="gesture-info">
                <span class="gesture-name">Finale</span>
                <span class="gesture-sub">Both Palms</span>
              </div>
            </div>
          </div>
        </footer>
      </div>

      <!-- Creator Mode Floating Pill (Shown when HUD hidden) -->
      <button id="btn-restore-hud" class="restore-hud-btn hidden" title="Show Controls (Press H)">
        <span>👁️ Show HUD [H]</span>
      </button>

      <!-- Festive Postcard Watermark -->
      <div id="watermark" class="festive-watermark">
        <span class="watermark-gold">✨ Happy Diwali ✨</span>
        <span class="watermark-sub">Fireworks Conductor</span>
      </div>

      <!-- Video Recording Preview Modal (Fog-Mirror Style) -->
      <div id="recording-modal" class="recording-modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-card">
          <div class="modal-header">
            <div class="modal-title-group">
              <span class="modal-spark">🎆</span>
              <span class="modal-title">Your Diwali Reel</span>
            </div>
            <button id="modal-close-btn" class="modal-close-btn" title="Close Preview">&times;</button>
          </div>
          <div class="modal-video-wrapper">
            <video id="preview-video" controls autoplay loop playsinline></video>
          </div>
          <div class="modal-footer">
            <button id="modal-download-btn" class="modal-btn btn-download">
              <span>⬇️ Download Reel (.webm)</span>
            </button>
            <button id="modal-retake-btn" class="modal-btn btn-retake">
              <span>✕ Retake</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
